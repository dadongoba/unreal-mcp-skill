name: Receive structured experience

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: experience-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  receive:
    if: startsWith(github.event.issue.title, '[unreal-mcp-experience] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate data and create an inbox PR in the original repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ingest_experience.py
