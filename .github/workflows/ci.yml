name: Runtime checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run isolation, transport and contribution regression tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -X utf8 -m compileall -q scripts
      - name: Verify official MCP client interoperability
        run: |
          python -m pip install mcp==2.3.0
          python -X utf8 tests/sdk_interop.py
      - name: Check documented schemas
        run: python -X utf8 scripts/refresh_schemas.py
